<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Truntum 8-ray Star Symbol -->
    <g id="truntumStar">
      <path d="M 0,-14 L 2.5,-4 L 14,0 L 2.5,4 L 0,14 L -2.5,4 L -14,0 L -2.5,-4 Z" stroke="#C5A059" stroke-width="0.6" fill="#C5A059" fill-opacity="0.15" />
      <path d="M -9,-9 L -3,-3 M 9,-9 L 3,-3 M -9,9 L -3,3 M 9,9 L 3,3" stroke="#C5A059" stroke-width="0.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#FAF6F0" stroke="#C5A059" stroke-width="0.6" />
      <circle cx="0" cy="0" r="1.2" fill="#C5A059" />
    </g>
    <!-- Kawung Petal Ellipse -->
    <g id="kawungQuad">
      <ellipse cx="0" cy="-18" rx="8" ry="14" stroke="#C5A059" stroke-width="0.6" fill="none" />
      <ellipse cx="0" cy="18" rx="8" ry="14" stroke="#C5A059" stroke-width="0.6" fill="none" />
      <ellipse cx="-18" cy="0" rx="14" ry="8" stroke="#C5A059" stroke-width="0.6" fill="none" />
      <ellipse cx="18" cy="0" rx="14" ry="8" stroke="#C5A059" stroke-width="0.6" fill="none" />
      <circle cx="0" cy="-18" r="1.5" fill="#C5A059" fill-opacity="0.3" />
      <circle cx="0" cy="18" r="1.5" fill="#C5A059" fill-opacity="0.3" />
      <circle cx="-18" cy="0" r="1.5" fill="#C5A059" fill-opacity="0.3" />
      <circle cx="18" cy="0" r="1.5" fill="#C5A059" fill-opacity="0.3" />
    </g>
  </defs>

  <!-- Diagonal Guidelines (Parang Hairlines) -->
  <line x1="0" y1="0" x2="120" y2="120" stroke="#C5A059" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.35" />
  <line x1="120" y1="0" x2="0" y2="120" stroke="#C5A059" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.35" />

  <!-- Center Kawung & Truntum Star -->
  <use href="#kawungQuad" x="60" y="60" />
  <use href="#truntumStar" x="60" y="60" />

  <!-- 4 Corners (Tiling Seamlessly) -->
  <use href="#kawungQuad" x="0" y="0" />
  <use href="#truntumStar" x="0" y="0" />

  <use href="#kawungQuad" x="120" y="0" />
  <use href="#truntumStar" x="120" y="0" />

  <use href="#kawungQuad" x="0" y="120" />
  <use href="#truntumStar" x="0" y="120" />

  <use href="#kawungQuad" x="120" y="120" />
  <use href="#truntumStar" x="120" y="120" />

  <!-- Mid-edge Accents -->
  <circle cx="60" cy="0" r="2.2" stroke="#C5A059" stroke-width="0.5" fill="#C5A059" fill-opacity="0.2" />
  <circle cx="60" cy="120" r="2.2" stroke="#C5A059" stroke-width="0.5" fill="#C5A059" fill-opacity="0.2" />
  <circle cx="0" cy="60" r="2.2" stroke="#C5A059" stroke-width="0.5" fill="#C5A059" fill-opacity="0.2" />
  <circle cx="120" cy="60" r="2.2" stroke="#C5A059" stroke-width="0.5" fill="#C5A059" fill-opacity="0.2" />
</svg>
