<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none" width="100%" height="100%">
  <defs>
    <pattern id="truntumGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#C5A059" stroke-width="0.5" opacity="0.35">
        <circle cx="40" cy="40" r="2.5" fill="#C5A059" fill-opacity="0.3" />
        <path d="M 40,32 L 40,48 M 32,40 L 48,40" stroke-linecap="round" />
        <path d="M 34,34 L 46,46 M 34,46 L 46,34" stroke-width="0.35" stroke-linecap="round" />
      </g>
    </pattern>
    <linearGradient id="goldArchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#D4B475" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#truntumGrid)" opacity="0.45" />

  <g stroke="url(#goldArchGrad)" stroke-width="1" fill="none" opacity="0.6">
