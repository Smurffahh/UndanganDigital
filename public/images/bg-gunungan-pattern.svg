  </g>

  <g transform="translate(400, 120)" stroke="#C5A059" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M 0,-40 C -15,-20 -30,-5 -45,15 C -25,10 -10,12 0,25 C 10,12 25,10 45,15 C 30,-5 15,-20 0,-40 Z" fill="#C5A059" fill-opacity="0.1" />
    <circle cx="0" cy="-45" r="3.5" fill="#C5A059" fill-opacity="0.6" />
    <circle cx="0" cy="-55" r="2" fill="#C5A059" />
    <circle cx="0" cy="0" r="5" fill="#FFFDF8" stroke-width="1" />
    <circle cx="0" cy="0" r="2" fill="#C5A059" />
  </g>

  <g stroke="#C5A059" stroke-width="1" fill="none" opacity="0.45">
