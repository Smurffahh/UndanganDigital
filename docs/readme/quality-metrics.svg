<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="metrics-title metrics-desc">
  <title id="metrics-title">Skor Kualitas Produksi Lighthouse — Fauzan &amp; Sinta</title>
  <desc id="metrics-desc">Ringkasan skor Lighthouse live: Accessibility 100, Best Practices 100, SEO 100, Agentic Browsing 100, dan Cumulative Layout Shift 0.00.</desc>

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#360711" />
      <stop offset="50%" stop-color="#560D1C" />
      <stop offset="100%" stop-color="#360711" />
    </linearGradient>

    <linearGradient id="ringGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C59B6D" />
    </linearGradient>

    <linearGradient id="ringClsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <style><![CDATA[
      @keyframes fillRing {
        from { stroke-dashoffset: 201.06; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes metricBreath {
        0%, 100% { stroke-opacity: 0.95; }
        50% { stroke-opacity: 0.72; }
      }
      .ring-progress {
        stroke-dasharray: 201.06;
        stroke-dashoffset: 0;
        animation: fillRing 1.1s cubic-bezier(0.22, 1, 0.36, 1) both, metricBreath 4s ease-in-out 1.4s infinite;
      }
      .delay-1 { animation-delay: 0.08s, 1.5s; }
      .delay-2 { animation-delay: 0.2s, 1.7s; }
      .delay-3 { animation-delay: 0.32s, 1.9s; }
      .delay-4 { animation-delay: 0.44s, 2.1s; }
      .delay-5 { animation-delay: 0.56s, 2.3s; }

      @media (prefers-reduced-motion: reduce) {
        .ring-progress {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    ]]></style>
  </defs>

  <!-- Main Card -->
  <rect x="6" y="4" width="1188" height="162" rx="16" fill="url(#cardBg)" stroke="#C59B6D" stroke-width="1" stroke-opacity="0.72" />
  <rect x="13" y="11" width="1174" height="148" rx="12" fill="none" stroke="#C59B6D" stroke-width="0.6" stroke-dasharray="4 4" stroke-opacity="0.32" />

  <!-- Column 1: Accessibility -->
  <g>
    <circle cx="136" cy="60" r="32" fill="#29040C" fill-opacity="0.55" stroke="#C59B6D" stroke-opacity="0.22" stroke-width="5.5" />
    <circle cx="136" cy="60" r="32" fill="none" stroke="url(#ringGoldGrad)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 136 60)" class="ring-progress delay-1" />
    <text x="136" y="67" text-anchor="middle" fill="#FBF7F2" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">100</text>
    <text x="136" y="114" text-anchor="middle" fill="#E6C894" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Accessibility</text>
  </g>

  <!-- Column 2: Best Practices -->
  <g>
    <circle cx="368" cy="60" r="32" fill="#29040C" fill-opacity="0.55" stroke="#C59B6D" stroke-opacity="0.22" stroke-width="5.5" />
    <circle cx="368" cy="60" r="32" fill="none" stroke="url(#ringGoldGrad)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 368 60)" class="ring-progress delay-2" />
    <text x="368" y="67" text-anchor="middle" fill="#FBF7F2" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">100</text>
    <text x="368" y="114" text-anchor="middle" fill="#E6C894" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Best Practices</text>
  </g>

  <!-- Column 3: SEO -->
  <g>
    <circle cx="600" cy="60" r="32" fill="#29040C" fill-opacity="0.55" stroke="#C59B6D" stroke-opacity="0.22" stroke-width="5.5" />
    <circle cx="600" cy="60" r="32" fill="none" stroke="url(#ringGoldGrad)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 600 60)" class="ring-progress delay-3" />
    <text x="600" y="67" text-anchor="middle" fill="#FBF7F2" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">100</text>
    <text x="600" y="114" text-anchor="middle" fill="#E6C894" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SEO</text>
  </g>

  <!-- Column 4: Agentic Browsing -->
  <g>
    <circle cx="832" cy="60" r="32" fill="#29040C" fill-opacity="0.55" stroke="#C59B6D" stroke-opacity="0.22" stroke-width="5.5" />
    <circle cx="832" cy="60" r="32" fill="none" stroke="url(#ringGoldGrad)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 832 60)" class="ring-progress delay-4" />
    <text x="832" y="67" text-anchor="middle" fill="#FBF7F2" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">100</text>
    <text x="832" y="114" text-anchor="middle" fill="#E6C894" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Agentic Browsing</text>
  </g>

  <!-- Column 5: Layout Shift (CLS) -->
  <g>
    <circle cx="1064" cy="60" r="32" fill="#29040C" fill-opacity="0.55" stroke="#34D399" stroke-opacity="0.2" stroke-width="5.5" />
    <circle cx="1064" cy="60" r="32" fill="none" stroke="url(#ringClsGrad)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 1064 60)" class="ring-progress delay-5" />
    <text x="1064" y="67" text-anchor="middle" fill="#FBF7F2" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700">0.00</text>
    <text x="1064" y="114" text-anchor="middle" fill="#A7F3D0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Layout Shift (CLS)</text>
  </g>

  <!-- Verification Caption -->
  <text x="600" y="144" text-anchor="middle" fill="#E6C894" fill-opacity="0.88" font-family="'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="0.4">
    Terverifikasi langsung di produksi https://www.fauzansinta.my.id/ via Chrome DevTools &amp; Lighthouse 13+
  </text>
</svg>
