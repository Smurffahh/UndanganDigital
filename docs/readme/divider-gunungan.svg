<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-label="Pemisah ornamen Gunungan Wayang Jawa">
  <defs>
    <linearGradient id="divLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B08448" stop-opacity="0" />
      <stop offset="25%" stop-color="#B08448" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#C59B6D" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="divLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="30%" stop-color="#C59B6D" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#B08448" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#B08448" stop-opacity="0" />
    </linearGradient>
    <style><![CDATA[
      @keyframes gununganShimmer {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .crest-center { transform-box: view-box; transform-origin: 600px 22px; animation: gununganShimmer 4s ease-in-out infinite; }
      .diamond-flank { animation: starBlink 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .crest-center, .diamond-flank { animation: none !important; }
      }
    ]]></style>
  </defs>

  <!-- Left Tapered Gold Line & Tendrils -->
  <line x1="110" y1="22" x2="548" y2="22" stroke="url(#divLineL)" stroke-width="1.5" />
  <path d="M 522 22 Q 535 12 548 15" fill="none" stroke="#B08448" stroke-width="1.1" opacity="0.9" />
  <path d="M 522 22 Q 535 32 548 29" fill="none" stroke="#B08448" stroke-width="1.1" opacity="0.9" />
  <polygon points="561,22 566,17 571,22 566,27" fill="#B08448" class="diamond-flank" />

  <!-- Right Tapered Gold Line & Tendrils -->
  <line x1="652" y1="22" x2="1090" y2="22" stroke="url(#divLineR)" stroke-width="1.5" />
  <path d="M 678 22 Q 665 12 652 15" fill="none" stroke="#B08448" stroke-width="1.1" opacity="0.9" />
  <path d="M 678 22 Q 665 32 652 29" fill="none" stroke="#B08448" stroke-width="1.1" opacity="0.9" />
  <polygon points="629,22 634,17 639,22 634,27" fill="#B08448" class="diamond-flank" />

  <!-- Center Maroon Badge + Gunungan Icon (Legible in both Light & Dark Mode) -->
  <g class="crest-center">
    <rect x="580" y="3" width="40" height="38" rx="19" fill="#5C0F1E" stroke="#C59B6D" stroke-width="1.2" />
    <path d="M 600 9 C 604 16 609 21 611 27 C 612 31 610 34 608 35 H 592 C 590 34 588 31 589 27 C 591 21 596 16 600 9 Z"
          fill="#D4AF37" fill-opacity="0.25" stroke="#FBF7F2" stroke-width="1" stroke-linejoin="round" />
    <line x1="600" y1="14" x2="600" y2="33" stroke="#FFE8A3" stroke-width="0.8" />
    <circle cx="600" cy="8" r="1.3" fill="#FFE8A3" />
  </g>
</svg>
