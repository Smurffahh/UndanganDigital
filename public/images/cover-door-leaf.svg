<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" fill="none" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="doorWoodBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE3CE" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#E7D6BD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DEC9AE" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="doorBevelShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A22" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5A3A22" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="goldMoldingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#EDD9B3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="verticalBrassSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F5E5C9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#996E24" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Door Base Background -->
  <rect width="100%" height="100%" fill="url(#doorWoodBase)" />

  <!-- Outer Architectural Framing Border -->
  <rect x="8" y="8" width="384" height="784" rx="2" stroke="url(#goldMoldingGrad)" stroke-width="1.2" opacity="0.65" />
  <rect x="14" y="14" width="372" height="772" rx="1.5" stroke="#5A3A22" stroke-width="0.8" opacity="0.18" />

  <!-- ==================== UPPER RECESSED PANEL ==================== -->
  <g id="upperPanel">
    <!-- Recessed shadow & fill -->
    <rect x="26" y="26" width="350" height="420" rx="4" fill="url(#doorBevelShadow)" />
    <rect x="28" y="28" width="346" height="416" rx="3" fill="#F4EAE0" fill-opacity="0.45" stroke="url(#goldMoldingGrad)" stroke-width="1.2" />
    <rect x="34" y="34" width="334" height="404" rx="2" stroke="#5A3A22" stroke-width="0.6" stroke-dasharray="4 2" opacity="0.3" />

    <!-- Corner Lung-lungan Carvings (Upper Panel) -->
    <!-- Top-Left -->
    <g transform="translate(36, 36)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,44 C 4,20 20,4 44,0" stroke-linecap="round" />
      <path d="M 0,30 C 6,16 16,6 30,0" stroke-width="0.75" />
      <path d="M 12,22 C 18,16 26,18 24,26 C 22,32 14,30 14,24" stroke-width="0.8" />
      <circle cx="8" cy="8" r="3" fill="#C5A059" fill-opacity="0.35" />
      <path d="M 4,40 C 14,36 18,22 10,26" fill="#C5A059" fill-opacity="0.15" stroke-width="0.6" />
      <path d="M 40,4 C 36,14 22,18 26,10" fill="#C5A059" fill-opacity="0.15" stroke-width="0.6" />
    </g>

    <!-- Top-Right -->
    <g transform="translate(366, 36) scale(-1, 1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,44 C 4,20 20,4 44,0" stroke-linecap="round" />
      <path d="M 0,30 C 6,16 16,6 30,0" stroke-width="0.75" />
      <path d="M 12,22 C 18,16 26,18 24,26 C 22,32 14,30 14,24" stroke-width="0.8" />
      <circle cx="8" cy="8" r="3" fill="#C5A059" fill-opacity="0.35" />
    </g>

    <!-- Bottom-Left -->
    <g transform="translate(36, 436) scale(1, -1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,44 C 4,20 20,4 44,0" stroke-linecap="round" />
      <path d="M 0,30 C 6,16 16,6 30,0" stroke-width="0.75" />
      <path d="M 12,22 C 18,16 26,18 24,26 C 22,32 14,30 14,24" stroke-width="0.8" />
      <circle cx="8" cy="8" r="3" fill="#C5A059" fill-opacity="0.35" />
    </g>

    <!-- Bottom-Right -->
    <g transform="translate(366, 436) scale(-1, -1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,44 C 4,20 20,4 44,0" stroke-linecap="round" />
      <path d="M 0,30 C 6,16 16,6 30,0" stroke-width="0.75" />
      <path d="M 12,22 C 18,16 26,18 24,26 C 22,32 14,30 14,24" stroke-width="0.8" />
      <circle cx="8" cy="8" r="3" fill="#C5A059" fill-opacity="0.35" />
    </g>

    <!-- Center Rosette Accent -->
    <g transform="translate(201, 236)" stroke="url(#goldMoldingGrad)" stroke-width="0.9" fill="none" opacity="0.65">
      <circle cx="0" cy="0" r="28" stroke-dasharray="2 3" />
      <circle cx="0" cy="0" r="16" stroke-width="1.1" />
      <circle cx="0" cy="0" r="4" fill="#C5A059" fill-opacity="0.5" />
      <path d="M 0,-24 L 0,-8 M 0,8 L 0,24 M -24,0 L -8,0 M 8,0 L 24,0" stroke-width="0.75" />
      <path d="M -14,-14 L -6,-6 M 6,6 L 14,14 M -14,14 L -6,6 M 6,-6 L 14,-14" stroke-width="0.6" />
    </g>
  </g>

  <!-- ==================== MIDDLE CROSS RAIL ==================== -->
  <rect x="18" y="460" width="366" height="34" fill="#E6D3B8" fill-opacity="0.4" stroke="url(#goldMoldingGrad)" stroke-width="1" />
  <line x1="24" y1="477" x2="378" y2="477" stroke="#5A3A22" stroke-width="0.7" opacity="0.25" stroke-dasharray="3 3" />

  <!-- ==================== LOWER RECESSED PANEL ==================== -->
  <g id="lowerPanel">
    <rect x="26" y="508" width="350" height="264" rx="4" fill="url(#doorBevelShadow)" />
    <rect x="28" y="510" width="346" height="260" rx="3" fill="#F4EAE0" fill-opacity="0.45" stroke="url(#goldMoldingGrad)" stroke-width="1.2" />
    <rect x="34" y="516" width="334" height="248" rx="2" stroke="#5A3A22" stroke-width="0.6" stroke-dasharray="4 2" opacity="0.3" />

    <!-- Corner Lung-lungan Carvings (Lower Panel) -->
    <!-- Top-Left -->
    <g transform="translate(36, 518)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,38 C 4,18 18,4 38,0" stroke-linecap="round" />
      <circle cx="8" cy="8" r="2.5" fill="#C5A059" fill-opacity="0.35" />
    </g>
    <!-- Top-Right -->
    <g transform="translate(366, 518) scale(-1, 1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,38 C 4,18 18,4 38,0" stroke-linecap="round" />
      <circle cx="8" cy="8" r="2.5" fill="#C5A059" fill-opacity="0.35" />
    </g>
    <!-- Bottom-Left -->
    <g transform="translate(36, 762) scale(1, -1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,38 C 4,18 18,4 38,0" stroke-linecap="round" />
      <circle cx="8" cy="8" r="2.5" fill="#C5A059" fill-opacity="0.35" />
    </g>
    <!-- Bottom-Right -->
    <g transform="translate(366, 762) scale(-1, -1)" stroke="url(#goldMoldingGrad)" stroke-width="1" fill="none">
      <path d="M 0,38 C 4,18 18,4 38,0" stroke-linecap="round" />
      <circle cx="8" cy="8" r="2.5" fill="#C5A059" fill-opacity="0.35" />
    </g>

    <!-- Center Lower Rosette -->
    <g transform="translate(201, 640)" stroke="url(#goldMoldingGrad)" stroke-width="0.9" fill="none" opacity="0.65">
      <circle cx="0" cy="0" r="20" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="11" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#C5A059" fill-opacity="0.5" />
    </g>
  </g>

  <!-- Vertical Inner Edge Brass Trim / Astragal (seam where doors meet) -->
  <rect x="394" y="0" width="6" height="800" fill="url(#verticalBrassSeam)" />
</svg>
