<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Sulur Lung-lungan Corner Filigree -->
    <g id="cornerFiligree">
      <!-- Main Curling Stem -->
      <path d="M 0,110 C 12,85 24,62 55,44 C 82,28 108,30 122,10" stroke="#C5A059" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 0,92 C 18,72 38,54 70,42 C 90,34 104,20 110,4" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="2 3" stroke-linecap="round" />
      <path d="M 14,110 C 30,82 52,66 85,58" stroke="#C5A059" stroke-width="0.8" stroke-linecap="round" />

      <!-- Spiral Tendrils -->
      <path d="M 55,44 C 62,36 72,32 78,38 C 82,42 80,50 74,52 C 68,54 62,48 66,44" stroke="#C5A059" stroke-width="0.95" stroke-linecap="round" />
      <path d="M 34,70 C 40,64 46,62 50,66 C 54,70 52,76 48,78 C 42,80 38,76 40,70" stroke="#C5A059" stroke-width="0.8" stroke-linecap="round" />
      <path d="M 86,22 C 92,16 98,14 102,18 C 106,22 104,28 98,30 C 92,32 88,26 90,22" stroke="#C5A059" stroke-width="0.8" stroke-linecap="round" />

      <!-- Daun Patran & Petal Accents -->
      <g fill="#C5A059" fill-opacity="0.12" stroke="#C5A059" stroke-width="0.75">
        <path d="M 22,86 C 28,72 42,78 34,92 Z" />
        <path d="M 42,60 C 50,48 64,54 56,68 Z" />
        <path d="M 70,36 C 78,26 90,30 84,42 Z" />
        <path d="M 94,14 C 100,6 110,8 106,18 Z" />
        <path d="M 60,68 C 72,62 76,74 68,80 Z" />
      </g>

      <!-- Jasmine Bud Dots -->
      <circle cx="122" cy="10" r="2.8" fill="#C5A059" fill-opacity="0.3" stroke="#C5A059" stroke-width="0.8" />
      <circle cx="110" cy="4" r="1.8" fill="#C5A059" />
      <circle cx="6" cy="106" r="2.8" fill="#C5A059" fill-opacity="0.2" stroke="#C5A059" stroke-width="0.8" />
    </g>

    <linearGradient id="sanctuaryGoldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#E0C282" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- ==================== OUTER DOUBLE HAIRLINE BORDER ==================== -->
  <rect x="20" y="20" width="760" height="1160" rx="8" stroke="url(#sanctuaryGoldGrad)" stroke-width="1" />
  <rect x="28" y="28" width="744" height="1144" rx="6" stroke="#C5A059" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.25" />

  <!-- ==================== ROYAL ARCHWAY HAIRLINE (TOP) ==================== -->
  <g stroke="#C5A059" fill="none" opacity="0.45">
    <!-- Primary Arch -->
    <path d="M 160,320 L 160,200 C 160,90 270,36 400,36 C 530,36 640,90 640,200 L 640,320" stroke-width="1" />
    <!-- Secondary Concentric Arch -->
    <path d="M 180,320 L 180,210 C 180,110 280,52 400,52 C 520,52 620,110 620,210 L 620,320" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.7" />
    <!-- Tertiary Inner Arch -->
    <path d="M 200,320 L 200,220 C 200,130 290,68 400,68 C 510,68 600,130 600,220 L 600,320" stroke-width="0.4" opacity="0.5" />

    <!-- Crown Crest / Mustaka at Arch Peak -->
    <g transform="translate(400, 36)" stroke-width="1">
      <path d="M 0,-22 C -10,-12 -18,-2 -26,8 C -14,6 -6,8 0,14 C 6,8 14,6 26,8 C 18,-2 10,-12 0,-22 Z" fill="#C5A059" fill-opacity="0.15" />
      <circle cx="0" cy="-26" r="2.5" fill="#C5A059" />
      <circle cx="0" cy="0" r="3.5" fill="#FAF6F0" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#C5A059" />
    </g>
  </g>

  <!-- ==================== 4 CORNER FILIGREES ==================== -->
  <!-- Top-Left Corner -->
  <g transform="translate(28, 28)">
    <use href="#cornerFiligree" />
  </g>

  <!-- Top-Right Corner -->
  <g transform="translate(772, 28) scale(-1, 1)">
    <use href="#cornerFiligree" />
  </g>

  <!-- Bottom-Left Corner -->
  <g transform="translate(28, 1172) scale(1, -1)">
    <use href="#cornerFiligree" />
  </g>

  <!-- Bottom-Right Corner -->
  <g transform="translate(772, 1172) scale(-1, -1)">
    <use href="#cornerFiligree" />
  </g>
</svg>
