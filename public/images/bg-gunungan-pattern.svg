    <path d="M 40,80 C 55,65 75,70 65,85 C 55,100 35,95 40,80 Z" fill="#C5A059" fill-opacity="0.12" stroke-width="0.7" />
    <path d="M 80,40 C 95,25 115,30 105,45 C 95,60 75,55 80,40 Z" fill="#C5A059" fill-opacity="0.12" stroke-width="0.7" />
  </g>

  <g transform="translate(800, 0) scale(-1, 1)" stroke="#C5A059" stroke-width="1" fill="none" opacity="0.45">
    <path d="M 0,160 C 80,140 140,80 160,0" />
    <path d="M 0,200 C 100,180 180,100 200,0" stroke-width="0.5" stroke-dasharray="3 3" />
    <path d="M 40,80 C 55,65 75,70 65,85 C 55,100 35,95 40,80 Z" fill="#C5A059" fill-opacity="0.12" stroke-width="0.7" />
    <path d="M 80,40 C 95,25 115,30 105,45 C 95,60 75,55 80,40 Z" fill="#C5A059" fill-opacity="0.12" stroke-width="0.7" />
  </g>
